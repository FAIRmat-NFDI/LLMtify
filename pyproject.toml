[project]
name = "hackframe"
version = "0.1.0"
description = "OO agentic framework on Microsoft Agent Framework: config-driven agents, executors, skills, MCP, context providers, LiteLLM, OTel/Aspire, DevUI"
requires-python = ">=3.11"
dependencies = [
    "agent-framework>=1.22.0",
    "agent-framework-devui",
    "opentelemetry-exporter-otlp-proto-grpc",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "mcp>=1.20,<2",  # PubChem-MCP uses FastMCP (removed in mcp 2.x)
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "requests>=2.31",  # NOMAD client
    "ase>=3.23",
    "rdkit>=2024.3",
    # BioContext PubChem MCP server (not on PyPI); pinned to the tested commit
    "pubchem-mcp @ git+https://github.com/BioContext/PubChem-MCP.git@3895180",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]

[project.scripts]
hackframe = "hackframe.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/hackframe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
