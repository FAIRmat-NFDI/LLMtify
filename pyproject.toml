[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LLMtify"
version = "0.1.0"
description = "LLM agentic framework for identifying subsystems in complex materials"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nomad-lab>=1.3.17",
    "rdkit>=2026.9.1",
    "slices>=2.0.12",
    "xtal2txt @ git+https://github.com/lamalab-org/xtal2txt.git@c6cf9593596ce99f054f1ebbdc4346d7dbec99fb",
]

[tool.uv]
exclude-dependencies = [
    "keras",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*"]
