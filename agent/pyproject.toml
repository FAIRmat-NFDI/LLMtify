[project]
name = "hackframe"
version = "0.1.0"
description = "OO agentic framework on Microsoft Agent Framework: config-driven agents, executors, skills, MCP, context providers, LiteLLM, OTel/Aspire, DevUI"
requires-python = ">=3.11"
dependencies = [
    "agent-framework>=1.22.0",
    "agent-framework-devui",
    "opentelemetry-exporter-otlp-proto-grpc",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "mcp>=1.20",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]

[project.scripts]
hackframe = "hackframe.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackframe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
