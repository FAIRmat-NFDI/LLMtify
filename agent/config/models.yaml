# Model profiles. Agents reference a profile by name, never a raw model id.
# provider: registered ModelProvider key (see src/hackframe/llm/providers.py)
providers:
  litellm:
    base_url: ${LITELLM_BASE_URL:-http://localhost:4000/v1}
    api_key: ${LITELLM_API_KEY:-sk-hackathon-master-key}

profiles:
  mini:
    provider: litellm
    model: gpt-5-mini
  nano:
    provider: litellm
    model: gpt-5-nano

default_profile: mini
