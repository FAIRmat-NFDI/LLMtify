# LiteLLM proxy routing table.
# `model_name` = alias the framework uses (config/models.yaml -> profile.model).
# Swap providers here without touching agent code.
model_list:
  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5-nano
    litellm_params:
      model: openai/gpt-5-nano
      api_key: os.environ/OPENAI_API_KEY

  # Example: Azure OpenAI deployment behind the same alias style
  # - model_name: azure-gpt-4o-mini
  #   litellm_params:
  #     model: azure/<deployment-name>
  #     api_base: os.environ/AZURE_API_BASE
  #     api_key: os.environ/AZURE_API_KEY
  #     api_version: "2024-10-21"

  # Example: local model via Ollama
  # - model_name: local-llama
  #   litellm_params:
  #     model: ollama/llama3.1
  #     api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true   # silently drop params a given model does not support
